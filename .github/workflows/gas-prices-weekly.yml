name: Gas official prices (weekly)

on:
  schedule:
    # Taiwan Monday 00:00, 00:05, 00:30 (UTC Sunday 16:00 / 16:05 / 16:30)
    - cron: '0 16 * * 0'
    - cron: '5 16 * * 0'
    - cron: '30 16 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PaymentMapTW app repo (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PAYMENTMAPTW_APP_REPO }}
          token: ${{ secrets.PAYMENTMAPTW_APP_TOKEN }}
          path: paymentmaptw-app
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official prices
        run: node tools/gas/fetch-official-prices.mjs
        working-directory: paymentmaptw-app

      - name: Fetch Costco member prices
        run: node tools/gas/fetch-costco-prices.mjs
        working-directory: paymentmaptw-app

      - name: Commit price data to app repo
        id: commit
        working-directory: paymentmaptw-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gas/official-prices.json data/gas/costco-prices.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No price changes"
          else
            git commit -m "chore(gas): update official fuel prices (weekly)"
            BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin "$BRANCH"
              if git push origin "$BRANCH"; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying after fetch..."
              git fetch origin "$BRANCH"
              sleep $((attempt * 5))
            done
            if [ "$pushed" != true ]; then
              echo "::error::Failed to push gas prices after 3 attempts"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
