name: Gas stations ingest (monthly)

on:
  schedule:
    # 1st of month 03:00 UTC (~11:00 Taipei)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-stations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PaymentMapTW app repo (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PAYMENTMAPTW_APP_REPO }}
          token: ${{ secrets.PAYMENTMAPTW_APP_TOKEN }}
          path: paymentmaptw-app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: paymentmaptw-app/tools/package-lock.json

      - name: Install ingest dependencies (xlsx)
        run: npm ci
        working-directory: paymentmaptw-app/tools

      - name: Fetch CPC + FPCC + Smile stations
        run: node tools/gas/fetch-stations.mjs
        working-directory: paymentmaptw-app

      - name: Commit station data to app repo
        id: commit
        working-directory: paymentmaptw-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/gas/stations.json \
            data/gas/raw/cpc-stations.xml \
            data/gas/raw/fpcc-*.html \
            data/gas/raw/smile-stations.xlsx || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No station changes"
          else
            git commit -m "chore(gas): monthly station ingest (CPC + FPCC Formosa network)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
