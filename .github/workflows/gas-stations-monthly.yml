name: Gas stations ingest (monthly)

on:
  schedule:
    # 1st of month 03:00 UTC (~11:00 Taipei)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-stations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cf-static-sync (FPCC cache + fetch patches)
        uses: actions/checkout@v4

      - name: Checkout PaymentMapTW app repo (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PAYMENTMAPTW_APP_REPO }}
          token: ${{ secrets.PAYMENTMAPTW_APP_TOKEN }}
          path: paymentmaptw-app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: paymentmaptw-app/tools/package-lock.json

      - name: Seed FPCC HTML cache and apply fetch patches
        run: |
          mkdir -p paymentmaptw-app/data/gas/raw
          cp -f fpcc-cache/fpcc-*.html paymentmaptw-app/data/gas/raw/
          cp -f tools/gas/fetch-fpcc-stations.mjs paymentmaptw-app/tools/gas/fetch-fpcc-stations.mjs
          cp -f tools/gas/fetch-fpcc-playwright.mjs paymentmaptw-app/tools/gas/fetch-fpcc-playwright.mjs
          cp -f tools/gas/fetch-stations.mjs paymentmaptw-app/tools/gas/fetch-stations.mjs

      - name: Install ingest dependencies (xlsx + Playwright)
        working-directory: paymentmaptw-app/tools
        run: |
          npm ci
          npm install playwright --no-save
          npx playwright install chromium --with-deps

      - name: Fetch CPC + FPCC + Smile stations
        run: node tools/gas/fetch-stations.mjs
        working-directory: paymentmaptw-app

      - name: Verify station count (prevent FPCC regression)
        working-directory: paymentmaptw-app
        run: |
          COUNT=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/gas/stations.json','utf8'));process.stdout.write(String(d.count))")
          FPCC=$(node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/gas/stations.json','utf8'));process.stdout.write(String(d.stations.filter(s=>s.source==='fpcc_official').length))")
          echo "stations=$COUNT fpcc=$FPCC"
          if [ "$COUNT" -lt 2500 ] || [ "$FPCC" -lt 400 ]; then
            echo "::error::Station ingest regression: count=$COUNT fpcc=$FPCC"
            exit 1
          fi

      - name: Commit station data to app repo
        id: commit
        working-directory: paymentmaptw-app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/gas/stations.json \
            data/gas/raw/cpc-stations.xml \
            data/gas/raw/fpcc-*.html \
            data/gas/raw/smile-stations.xlsx || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No station changes"
          else
            git commit -m "chore(gas): monthly station ingest (CPC + FPCC Formosa network)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
