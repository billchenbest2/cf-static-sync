name: Pay activities pipeline (every 5 days → CardSwitch)

# Crawl + OCR + AI into cf-static-sync/data/pay (cached), then publish to CardSwitch.
# Taipei window (gated): every 5 days (1/6/11/16/21/26) at 00:30

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform filter (empty = all). e.g. linepay"
        required: false
        default: ""
      skip_fetch:
        description: "Skip crawl"
        type: boolean
        default: false
      skip_ai:
        description: "Skip AI"
        type: boolean
        default: false
      ai_force_all:
        description: "Re-AI every active row"
        type: boolean
        default: false
      skip_publish_cardswitch:
        description: "Only update cf-static-sync data/pay cache"
        type: boolean
        default: false
  schedule:
    # Daily 16:30 UTC (= 00:30 Taipei next calendar day). Gate keeps only
    # Taipei days 1/6/11/16/21/26 so the cadence is every ~5 days.
    - cron: "30 16 * * *"

concurrency:
  group: pay-activities-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout cf-static-sync
        uses: actions/checkout@v4

      - name: Schedule gate (Asia/Taipei)
        id: gate
        continue-on-error: true
        run: node tools/pay-pipeline/should-run.mjs

      - name: Skip outside window
        if: steps.gate.outcome == 'failure' && github.event_name == 'schedule'
        run: |
          echo "Outside every-5-days Taipei window — exiting successfully."
          exit 0

      - name: Require secrets
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Missing secret GEMINI_API_KEY"
            exit 1
          fi
          if [ "${{ inputs.skip_publish_cardswitch }}" != "true" ]; then
            if [ -z "${{ secrets.CARDSWITCH_REPO }}" ]; then
              echo "Missing secret CARDSWITCH_REPO"
              exit 1
            fi
            if [ -z "${{ secrets.PAYMENTMAPTW_APP_TOKEN }}" ]; then
              echo "Missing secret PAYMENTMAPTW_APP_TOKEN"
              exit 1
            fi
          fi

      - name: Checkout CardSwitch (optional publish target)
        if: (steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch') && inputs.skip_publish_cardswitch != true
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CARDSWITCH_REPO }}
          token: ${{ secrets.PAYMENTMAPTW_APP_TOKEN }}
          path: cardswitch
          fetch-depth: 0

      - name: Ensure local pay cache exists
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data/pay
          if [ ! -f data/pay/platforms.json ] && [ -d cardswitch/data/pay ]; then
            echo "Seeding data/pay from CardSwitch checkout"
            node tools/pay-pipeline/seed-pay-cache.mjs --from cardswitch/data/pay
          fi
          ls -la data/pay | head -40

      - name: Setup Node
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/pay-activities/package-lock.json

      - name: Install pay-activities deps
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        working-directory: tools/pay-activities
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Write Gemini .env
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf 'GEMINI_API_KEY=%s\nGEMINI_MODEL=gemini-3.1-flash-lite\n' "$GEMINI_API_KEY" > tools/pay-activities/.env

      - name: Run pay pipeline (writes data/pay cache)
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        env:
          PAY_DATA_DIR: ${{ github.workspace }}/data/pay
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA=()
          if [ -n "${{ inputs.platform }}" ]; then
            EXTRA+=(--platform "${{ inputs.platform }}")
          fi
          if [ "${{ inputs.skip_fetch }}" = "true" ]; then
            EXTRA+=(--skip-fetch)
          fi
          if [ "${{ inputs.skip_ai }}" = "true" ]; then
            EXTRA+=(--skip-ai)
          fi
          if [ "${{ inputs.ai_force_all }}" = "true" ]; then
            EXTRA+=(--ai-force-all)
          fi
          node tools/pay-pipeline/run.mjs "${EXTRA[@]}"

      - name: Upload pay data artifact
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pay-data-cache
          path: data/pay
          if-no-files-found: warn
          retention-days: 14

      - name: Commit data/pay cache on cf-static-sync
        if: steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pay
          git reset HEAD -- data/pay/ocr-cache data/pay/ai-quota.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cf-static-sync data/pay changes"
          else
            git commit -m "chore(pay): refresh data/pay crawl cache"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push origin HEAD
          fi

      - name: Publish data/pay to CardSwitch
        if: (steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch') && inputs.skip_publish_cardswitch != true
        env:
          PAY_DATA_DIR: ${{ github.workspace }}/data/pay
          CARDSWITCH_PAY_DIR: ${{ github.workspace }}/cardswitch/data/pay
        run: node tools/pay-pipeline/publish-pay-to-cardswitch.mjs

      - name: Commit data/pay to CardSwitch
        if: (steps.gate.outcome == 'success' || github.event_name == 'workflow_dispatch') && inputs.skip_publish_cardswitch != true
        working-directory: cardswitch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached data/pay/ocr-cache 2>/dev/null || true
          git rm --cached data/pay/ai-quota.json 2>/dev/null || true
          git add data/pay
          git reset HEAD -- data/pay/ocr-cache data/pay/ai-quota.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No CardSwitch data/pay changes"
            exit 0
          fi
          git commit -m "chore: pay activities pipeline update (every 5 days)"
          git reset --hard HEAD
          git clean -fd
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" || true
            if git push origin "$BRANCH"; then
              echo "Pushed CardSwitch data/pay"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Failed to push CardSwitch"
          exit 1

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            exit 0
          fi
          MSG="Pay activities pipeline failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${MSG}\"}" >/dev/null
