name: Publish static bundle

on:
  # Static publish is triggered by the Worker (debounced 15 min after D1 store
  # changes) via repository_dispatch. Manual runs only here as fallback.
  workflow_dispatch:
  repository_dispatch:
    types: [static-publish]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tools

      - name: Write wrangler config from secrets
        run: node scripts/gen-wrangler-config.mjs
        env:
          D1_META_NAME: ${{ secrets.D1_META_NAME }}
          D1_META_ID: ${{ secrets.D1_META_ID }}
          D1_STORES_0_NAME: ${{ secrets.D1_STORES_0_NAME }}
          D1_STORES_0_ID: ${{ secrets.D1_STORES_0_ID }}
          D1_STORES_1_NAME: ${{ secrets.D1_STORES_1_NAME }}
          D1_STORES_1_ID: ${{ secrets.D1_STORES_1_ID }}
          D1_STORES_2_NAME: ${{ secrets.D1_STORES_2_NAME }}
          D1_STORES_2_ID: ${{ secrets.D1_STORES_2_ID }}

      - name: Prepare output directory
        run: |
          mkdir -p site/dist
          cp site/_headers site/dist/

      - name: Sync store chunks (patch default, full when requested)
        run: node sync-chunks.mjs
        working-directory: tools
        env:
          CHUNK_XOR_SEED: ${{ secrets.CHUNK_XOR_SEED }}
          CHUNK_PATH_OBFUSCATE: '1'
          CHUNK_LAYOUT: 'geo'
          EXPORT_QUERY_PAGE: '2000'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_META_DB: ${{ secrets.D1_META_NAME }}
          D1_STORES_PREFIX: ${{ secrets.D1_STORES_PREFIX }}
          WRANGLER_CWD: ${{ github.workspace }}/wrangler
          OUTPUT_DIR: ${{ github.workspace }}/site/dist
          PAGES_BASE: https://${{ secrets.PAGES_PROJECT_NAME }}.pages.dev
          SYNC_MODE: ${{ github.event.client_payload.sync_mode || 'patch' }}
          PATCH_DELETE_KEYS: ${{ github.event.client_payload.deleted_place_keys || '' }}
          PATCH_ADD_KEYS: ${{ github.event.client_payload.added_place_keys || '' }}
          READ_DELTA_FROM_D1: ${{ github.event.client_payload.read_delta_from_d1 || '1' }}

      - name: Build encrypted search index from map chunks
        run: node build-search-index.mjs
        working-directory: tools
        env:
          CHUNK_XOR_SEED: ${{ secrets.CHUNK_XOR_SEED }}
          OUTPUT_DIR: ${{ github.workspace }}/site/dist
          PAGES_BASE: https://${{ secrets.PAGES_PROJECT_NAME }}.pages.dev

      - name: Build gas community prices from D1
        run: node build-gas-community-prices.mjs
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_META_DB: ${{ secrets.D1_META_NAME }}
          WRANGLER_CWD: ${{ github.workspace }}/wrangler
          OUTPUT_DIR: ${{ github.workspace }}/site/dist

      - name: Build gas admin promotions from D1
        run: node build-gas-admin-promotions.mjs
        working-directory: tools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_META_DB: ${{ secrets.D1_META_NAME }}
          WRANGLER_CWD: ${{ github.workspace }}/wrangler
          OUTPUT_DIR: ${{ github.workspace }}/site/dist

      - name: Verify gas static JSON outputs
        run: |
          test -f site/dist/gas/community-prices.json
          test -f site/dist/gas/admin-promotions.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('site/dist/gas/admin-promotions.json','utf8'));if(!Array.isArray(p.promotions)) throw new Error('invalid admin-promotions schema');console.log('admin-promotions',p.promotions.length);"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy site/dist --project-name=${{ secrets.PAGES_PROJECT_NAME }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
